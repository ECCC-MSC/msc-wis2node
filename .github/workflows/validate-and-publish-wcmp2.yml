name: Validate and publish WCMP2 discovery metadata

env:
    CENTRE_ID: ca-eccc-msc
    PYWIS_PUBSUB_BROKER_URL: ${{ secrets.PYWIS_PUBSUB_BROKER_URL }}

on:
  push:
    branches:
      - 'gh-pages'
#    paths:
#      - 'metadata/*.json'

jobs:
  main:
    runs-on: ubuntu-latest
    steps:
    - name: checkout gh-pages branch
      uses: actions/checkout@master
      with:
        ref: gh-pages
        fetch-depth: 0
    - uses: actions/setup-python@v5
      name: Setup Python ${{ matrix.python-version }}
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install requirements
      run: |
        python3 -m pip install --upgrade pip
        pip3 install https://github.com/wmo-im/pywcmp/archive/master.zip
        pip3 install https://github.com/wmo-im/pywis-pubsub/archive/main.zip
    - name: Cache WCMP2 schemas for validation
      run: |
        pywcmp bundle sync        
    - name: Validate WCMP2 records
      run: |
        git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" -- 'metadata/*.json' | while IFS= read -r wcmp2file; do
          pywcmp ets validate $wcmp2file
        done
    - name: Publish WNMs of new/updated WCMP2 records
      run: |
        git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" -- 'metadata/*.json' | while IFS= read -r wcmp2file; do
          echo "Publishing $wcmp2file"
          pywis-pubsub wnm publish --topic origin/a/wis2/${CENTRE_ID}/metadata --config config/pywis-pubsub-publish.yml -u https://eccc-msc.github.io/msc-wis2node/$wcmp2file -op update -v DEBUG
        done
